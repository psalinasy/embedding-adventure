<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Choose Your Embedding Adventure · Metabase</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='9' fill='%23509EE3'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700;900&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --blue:#509EE3;
    --blue-deep:#2D7CC4;
    --blue-tint:#E8F2FB;
    --ink:#1B2733;
    --slate:#4C5773;
    --slate-soft:#7A8499;
    --paper:#F7FAFD;
    --card:#FFFFFF;
    --line:#E1E8F0;
    --green:#88BF4D;
    --purple:#A989C5;
    --gold:#F2C038;
    --salmon:#EF8C8C;
    --shadow:0 1px 2px rgba(27,39,51,.04), 0 12px 32px rgba(45,124,196,.10);
    --shadow-lift:0 2px 4px rgba(27,39,51,.06), 0 20px 48px rgba(45,124,196,.18);
    --font-display:"Lato",system-ui,sans-serif;
    --font-body:"Lato",system-ui,sans-serif;
    --font-mono:"Space Mono",ui-monospace,monospace;
  }

  *{box-sizing:border-box;margin:0;padding:0}
  html{scroll-behavior:smooth}
  body{
    font-family:var(--font-body);
    color:var(--ink);
    background-color:var(--paper);
    background-image:radial-gradient(var(--line) 1.1px, transparent 1.1px);
    background-size:22px 22px;
    background-position:-11px -11px;
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
    text-rendering:optimizeLegibility;
  }

  /* ---------- header ---------- */
  .topbar{
    display:flex;align-items:center;justify-content:space-between;
    gap:16px;
    padding:18px clamp(18px,5vw,48px);
    border-bottom:1px solid var(--line);
    background:rgba(247,250,253,.82);
    backdrop-filter:blur(8px);
    position:sticky;top:0;z-index:20;
  }
  .brand{display:flex;align-items:center;gap:12px}
  .brand .mark{flex:none}
  .brand .wordmark{display:flex;flex-direction:column;line-height:1}
  .brand .wordmark b{
    font-family:var(--font-display);font-weight:700;font-size:1.05rem;letter-spacing:-.01em;color:var(--ink);
  }
  .brand .wordmark span{
    font-family:var(--font-mono);font-size:.62rem;letter-spacing:.18em;text-transform:uppercase;color:var(--slate-soft);margin-top:3px;
  }
  .restart{
    font-family:var(--font-mono);font-size:.72rem;letter-spacing:.04em;
    border:1px solid var(--line);background:var(--card);color:var(--slate);
    padding:9px 14px;border-radius:999px;cursor:pointer;transition:all .18s ease;
    display:inline-flex;align-items:center;gap:7px;
  }
  .restart:hover{border-color:var(--blue);color:var(--blue-deep);background:var(--blue-tint)}
  .restart[hidden]{display:none}

  /* ---------- layout ---------- */
  .stage{
    max-width:760px;margin:0 auto;
    padding:clamp(28px,6vw,64px) clamp(18px,5vw,32px) 88px;
  }

  /* ---------- dot trail (signature) ---------- */
  .trail{
    display:flex;align-items:center;gap:0;
    min-height:30px;margin-bottom:34px;
    flex-wrap:wrap;
  }
  .trail[hidden]{display:none}
  .trail .seg{display:flex;align-items:center}
  .trail .link{
    width:26px;height:2px;background:var(--blue);opacity:.32;border-radius:2px;
    transform-origin:left;animation:grow .4s ease both;
  }
  .trail .node{
    width:11px;height:11px;border-radius:50%;background:var(--blue);
    box-shadow:0 0 0 4px var(--blue-tint);
    animation:pop .32s cubic-bezier(.2,1.3,.5,1) both;
  }
  .trail .node.current{
    width:15px;height:15px;background:var(--card);border:3px solid var(--blue);
    box-shadow:0 0 0 4px var(--blue-tint);
    animation:pulse 1.8s ease-in-out infinite;
  }
  .trail .node.done{background:var(--green);box-shadow:0 0 0 4px rgba(136,191,77,.18)}
  @keyframes grow{from{transform:scaleX(0);opacity:0}to{transform:scaleX(1);opacity:.32}}
  @keyframes pop{from{transform:scale(0)}to{transform:scale(1)}}
  @keyframes pulse{0%,100%{box-shadow:0 0 0 4px var(--blue-tint)}50%{box-shadow:0 0 0 8px rgba(80,158,227,.10)}}

  /* ---------- scene ---------- */
  .scene{animation:enter .42s cubic-bezier(.2,.7,.3,1) both}
  .scene.leaving{animation:leave .22s ease both}
  @keyframes enter{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
  @keyframes leave{from{opacity:1}to{opacity:0;transform:translateY(-8px)}}

  .eyebrow{
    font-family:var(--font-mono);font-size:.72rem;letter-spacing:.16em;text-transform:uppercase;
    color:var(--blue-deep);display:flex;align-items:center;gap:9px;margin-bottom:16px;
  }
  .eyebrow::before{content:"";width:20px;height:1.5px;background:var(--blue);display:inline-block;border-radius:2px}

  h1.q{
    font-family:var(--font-display);font-weight:700;letter-spacing:-.02em;line-height:1.08;
    font-size:clamp(1.9rem,5vw,2.85rem);color:var(--ink);max-width:18ch;
  }
  .sub{margin-top:14px;font-size:1.04rem;line-height:1.55;color:var(--slate);max-width:54ch}

  /* ---------- choices ---------- */
  .choices{display:flex;flex-direction:column;gap:13px;margin-top:34px}
  .choice{
    display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:16px;
    text-align:left;width:100%;cursor:pointer;
    background:var(--card);border:1px solid var(--line);border-radius:16px;
    padding:18px 20px;font-family:inherit;color:inherit;
    box-shadow:var(--shadow);transition:transform .16s ease,border-color .16s ease,box-shadow .16s ease;
    position:relative;overflow:hidden;
  }
  .choice::before{
    content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--blue);
    transform:scaleY(0);transform-origin:top;transition:transform .2s ease;
  }
  .choice:hover,.choice:focus-visible{
    transform:translateY(-2px);border-color:var(--blue);box-shadow:var(--shadow-lift);outline:none;
  }
  .choice:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
  .choice:hover::before,.choice:focus-visible::before{transform:scaleY(1)}
  .choice .dot{
    width:13px;height:13px;border-radius:50%;border:2px solid var(--blue);background:var(--blue-tint);
    flex:none;transition:all .16s ease;
  }
  .choice:hover .dot,.choice:focus-visible .dot{background:var(--blue);box-shadow:0 0 0 4px var(--blue-tint)}
  .choice .body b{
    display:block;font-family:var(--font-display);font-weight:600;font-size:1.08rem;letter-spacing:-.01em;color:var(--ink);
  }
  .choice .body span{display:block;margin-top:4px;font-size:.92rem;line-height:1.45;color:var(--slate)}
  .choice .arrow{color:var(--slate-soft);transition:transform .16s ease,color .16s ease;flex:none}
  .choice:hover .arrow,.choice:focus-visible .arrow{transform:translateX(3px);color:var(--blue-deep)}

  .backrow{margin-top:26px}
  .back{
    font-family:var(--font-mono);font-size:.74rem;letter-spacing:.04em;color:var(--slate-soft);
    background:none;border:none;cursor:pointer;display:inline-flex;align-items:center;gap:7px;padding:6px 2px;
    transition:color .16s ease;
  }
  .back:hover{color:var(--blue-deep)}
  .back[hidden]{display:none}

  /* ---------- result ---------- */
  .verdict-tag{
    display:inline-flex;align-items:center;gap:9px;
    font-family:var(--font-mono);font-size:.7rem;letter-spacing:.16em;text-transform:uppercase;
    color:var(--green);margin-bottom:16px;
  }
  .verdict-tag .check{
    width:20px;height:20px;border-radius:50%;background:var(--green);
    display:grid;place-items:center;flex:none;
  }
  h1.verdict{
    font-family:var(--font-display);font-weight:900;letter-spacing:-.025em;line-height:1.04;
    font-size:clamp(2.1rem,6vw,3.2rem);color:var(--ink);
  }
  .tagline{margin-top:14px;font-size:1.12rem;line-height:1.5;color:var(--slate);max-width:50ch}

  .panel{
    background:var(--card);border:1px solid var(--line);border-radius:18px;
    box-shadow:var(--shadow);margin-top:28px;overflow:hidden;
  }
  .panel .phead{
    padding:18px 22px 6px;
    font-family:var(--font-mono);font-size:.7rem;letter-spacing:.14em;text-transform:uppercase;color:var(--blue-deep);
  }
  .why{list-style:none;padding:8px 22px 20px;display:flex;flex-direction:column;gap:14px}
  .why li{display:grid;grid-template-columns:auto 1fr;gap:13px;align-items:start;font-size:1rem;line-height:1.5;color:var(--ink)}
  .why li .mb-dot{margin-top:7px;width:9px;height:9px;border-radius:50%;background:var(--blue);flex:none;box-shadow:0 0 0 3px var(--blue-tint)}

  .note{
    display:grid;grid-template-columns:auto 1fr;gap:13px;align-items:start;
    margin-top:18px;padding:16px 18px;border-radius:14px;
    background:var(--blue-tint);border:1px solid #CFE4F7;
    font-size:.96rem;line-height:1.5;color:var(--slate);
  }
  .note .ic{flex:none;margin-top:1px}
  .note b{color:var(--ink);font-family:var(--font-body);font-weight:900}

  /* data architecture accordion */
  .accordion{margin-top:16px;border:1px solid var(--line);border-radius:16px;background:var(--card);box-shadow:var(--shadow);overflow:hidden}
  .acc-toggle{
    width:100%;display:flex;align-items:center;justify-content:space-between;gap:14px;
    background:none;border:none;cursor:pointer;font-family:inherit;color:inherit;
    padding:18px 20px;text-align:left;
  }
  .acc-toggle .lhs{display:flex;align-items:center;gap:12px}
  .acc-toggle .ic{width:30px;height:30px;border-radius:9px;background:var(--blue-tint);display:grid;place-items:center;flex:none}
  .acc-toggle b{font-family:var(--font-display);font-weight:600;font-size:1.02rem;letter-spacing:-.01em}
  .acc-toggle small{display:block;font-size:.82rem;color:var(--slate-soft);margin-top:2px;font-family:var(--font-body)}
  .acc-toggle .chev{transition:transform .25s ease;color:var(--slate-soft);flex:none}
  .accordion.open .acc-toggle .chev{transform:rotate(180deg)}
  .acc-body{display:grid;grid-template-rows:0fr;transition:grid-template-rows .3s ease}
  .accordion.open .acc-body{grid-template-rows:1fr}
  .acc-inner{overflow:hidden}
  .acc-pad{padding:4px 20px 22px;border-top:1px solid var(--line)}
  .arch-row{padding:15px 0;border-bottom:1px dashed var(--line)}
  .arch-row:last-child{border-bottom:none}
  .arch-row .scheme{display:flex;align-items:center;gap:9px;font-family:var(--font-display);font-weight:600;font-size:.98rem;color:var(--ink)}
  .arch-row .scheme .tag{width:8px;height:8px;border-radius:50%;flex:none}
  .arch-row p{margin-top:6px;margin-left:17px;font-size:.93rem;line-height:1.5;color:var(--slate)}
  .arch-row code{font-family:var(--font-mono);font-size:.85em;background:var(--blue-tint);color:var(--blue-deep);padding:1px 6px;border-radius:5px}
  .arch-note{
    margin-top:14px;padding:13px 16px;border-radius:12px;background:#FFF8E6;border:1px solid #F4E2A8;
    font-size:.9rem;line-height:1.5;color:#7A6320;
  }
  .arch-note b{color:#604e15}

  /* result actions */
  .actions{display:flex;flex-wrap:wrap;gap:12px;margin-top:30px;align-items:center}
  .btn-primary{
    display:inline-flex;align-items:center;gap:9px;
    background:var(--blue);color:#fff;border:none;cursor:pointer;
    font-family:var(--font-display);font-weight:600;font-size:.96rem;
    padding:13px 22px;border-radius:12px;text-decoration:none;
    box-shadow:0 8px 20px rgba(80,158,227,.32);transition:all .16s ease;
  }
  .btn-primary:hover{background:var(--blue-deep);transform:translateY(-2px);box-shadow:0 12px 26px rgba(80,158,227,.4)}
  .btn-ghost{
    display:inline-flex;align-items:center;gap:8px;
    background:var(--card);color:var(--slate);border:1px solid var(--line);cursor:pointer;
    font-family:var(--font-display);font-weight:700;font-size:.94rem;
    padding:13px 20px;border-radius:12px;transition:all .16s ease;
  }
  .btn-ghost:hover{border-color:var(--blue);color:var(--blue-deep)}
  .btn-outline{
    display:inline-flex;align-items:center;gap:9px;
    background:var(--card);color:var(--blue-deep);border:1.5px solid var(--blue);cursor:pointer;text-decoration:none;
    font-family:var(--font-display);font-weight:700;font-size:.96rem;
    padding:11.5px 21px;border-radius:12px;transition:all .16s ease;
  }
  .btn-outline:hover{background:var(--blue-tint);border-color:var(--blue-deep);transform:translateY(-2px)}

  /* ---------- intro ---------- */
  .intro{text-align:center;padding-top:clamp(10px,4vw,40px)}
  .intro .constellation{margin:0 auto 30px;width:120px;height:120px}
  .intro h1{
    font-family:var(--font-display);font-weight:900;letter-spacing:-.03em;line-height:1.02;
    font-size:clamp(2.4rem,7vw,4rem);color:var(--ink);
  }
  .intro h1 em{font-style:normal;color:var(--blue)}
  .intro p{margin:20px auto 0;font-size:1.12rem;line-height:1.6;color:var(--slate);max-width:46ch}
  .intro .legend{
    display:flex;flex-wrap:wrap;gap:10px 22px;justify-content:center;margin:28px auto 0;max-width:40ch;
    font-family:var(--font-mono);font-size:.74rem;letter-spacing:.03em;color:var(--slate-soft);
  }
  .intro .legend span{display:inline-flex;align-items:center;gap:7px}
  .intro .legend i{width:9px;height:9px;border-radius:50%;display:inline-block}
  .intro .start{
    margin-top:38px;display:inline-flex;align-items:center;gap:11px;
    background:var(--blue);color:#fff;border:none;cursor:pointer;
    font-family:var(--font-display);font-weight:600;font-size:1.06rem;
    padding:16px 30px;border-radius:14px;
    box-shadow:0 10px 28px rgba(80,158,227,.34);transition:all .18s ease;
  }
  .intro .start:hover{background:var(--blue-deep);transform:translateY(-3px);box-shadow:0 16px 36px rgba(80,158,227,.42)}

  /* ---------- optional permissions CTA (part 2) ---------- */
  .next-cta{
    margin-top:20px;padding:24px;border-radius:18px;
    background:linear-gradient(180deg,#FBF8FE 0%,#F6F1FB 100%);
    border:1px solid #E5D8F1;box-shadow:var(--shadow);
  }
  .next-cta .k{
    font-family:var(--font-mono);font-size:.68rem;letter-spacing:.16em;text-transform:uppercase;
    color:#8A5FB5;display:flex;align-items:center;gap:9px;margin-bottom:12px;
  }
  .next-cta .k::before{content:"";width:18px;height:1.5px;background:var(--purple);border-radius:2px}
  .next-cta h3{
    font-family:var(--font-display);font-weight:900;font-size:1.32rem;letter-spacing:-.02em;color:var(--ink);
    display:flex;align-items:center;gap:11px;line-height:1.15;
  }
  .next-cta h3 svg{flex:none;stroke:#8A5FB5}
  .next-cta p{margin-top:11px;font-size:.98rem;line-height:1.55;color:var(--slate);max-width:56ch}
  .btn-purple{
    display:inline-flex;align-items:center;gap:9px;
    background:var(--purple);color:#fff;border:none;cursor:pointer;text-decoration:none;
    font-family:var(--font-display);font-weight:700;font-size:.96rem;
    padding:13px 22px;border-radius:12px;
    box-shadow:0 8px 20px rgba(169,137,197,.4);transition:all .16s ease;
  }
  .next-cta .btn-purple{margin-top:18px}
  .btn-purple:hover{background:#9774BA;transform:translateY(-2px);box-shadow:0 12px 26px rgba(169,137,197,.5)}

  /* part-2 (permissions) result accents */
  .verdict-tag.part2{color:#8A5FB5}
  .verdict-tag.part2 .check{background:var(--purple)}
  .panel.part2{border-color:#E5D8F1}
  .panel.part2 .phead{color:#8A5FB5}
  .why li .mb-dot.purple{background:var(--purple);box-shadow:0 0 0 3px #F1E9F8}
  .note.part2{background:#F6F1FB;border-color:#E5D8F1;color:var(--slate)}
  .note.part2 .ic{stroke:#8A5FB5}

  /* trail label + part-2 dots */
  .trail-label{
    font-family:var(--font-mono);font-size:.66rem;letter-spacing:.13em;text-transform:uppercase;
    color:var(--slate-soft);margin-right:14px;padding:4px 10px;border-radius:999px;
    background:var(--blue-tint);color:var(--blue-deep);white-space:nowrap;
  }
  .trail-label.p2{background:#F1E9F8;color:#8A5FB5}
  .trail .node.done.p2{background:var(--purple);box-shadow:0 0 0 4px #F1E9F8}
  .trail .node.current.p2{border-color:var(--purple);box-shadow:0 0 0 4px #F1E9F8;animation:pulseP2 1.8s ease-in-out infinite}
  @keyframes pulseP2{0%,100%{box-shadow:0 0 0 4px #F1E9F8}50%{box-shadow:0 0 0 8px rgba(169,137,197,.12)}}
  .trail .link.p2{background:var(--purple)}

  /* ---------- summary / recap ---------- */
  .verdict-tag.plan{color:var(--blue-deep)}
  .verdict-tag.plan .check{background:var(--blue)}
  .recap{
    display:grid;grid-template-columns:1fr auto 1fr;align-items:stretch;gap:14px;margin-top:28px;
  }
  .recap-arrow{display:grid;place-items:center;color:var(--slate-soft)}
  .recap-arrow svg{width:26px;height:26px}
  .recap-card{
    background:var(--card);border:1px solid var(--line);border-radius:18px;padding:22px;
    box-shadow:var(--shadow);position:relative;overflow:hidden;display:flex;flex-direction:column;
  }
  .recap-card::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px}
  .recap-card.blue::before{background:var(--blue)}
  .recap-card.purple::before{background:var(--purple)}
  .recap-card .rc-k{
    font-family:var(--font-mono);font-size:.66rem;letter-spacing:.14em;text-transform:uppercase;margin-bottom:10px;
  }
  .recap-card.blue .rc-k{color:var(--blue-deep)}
  .recap-card.purple .rc-k{color:#8A5FB5}
  .recap-card h3{font-family:var(--font-display);font-weight:900;font-size:1.45rem;letter-spacing:-.02em;line-height:1.1;color:var(--ink)}
  .recap-card>p{margin-top:9px;font-size:.97rem;line-height:1.5;color:var(--slate)}
  .recap-card .rc-foot{
    display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:start;
    margin-top:16px;padding-top:14px;border-top:1px dashed var(--line);
    font-size:.86rem;line-height:1.45;color:var(--slate-soft);
  }
  .recap-card .rc-foot b{color:var(--slate)}
  @media (max-width:640px){
    .recap{grid-template-columns:1fr}
    .recap-arrow{transform:rotate(90deg);padding:2px 0}
  }

  /* ---------- live demo link ---------- */
  .demo-cta{
    margin-top:20px;padding:24px;border-radius:18px;
    background:linear-gradient(180deg,#F4F9FE 0%,#EAF3FC 100%);
    border:1px solid #CFE4F7;box-shadow:var(--shadow);
  }
  .demo-cta h3{
    font-family:var(--font-display);font-weight:900;font-size:1.32rem;letter-spacing:-.02em;
    color:var(--ink);margin-top:6px;line-height:1.15;
  }
  .demo-cta>p{margin-top:11px;font-size:.98rem;line-height:1.55;color:var(--slate);max-width:56ch}
  .demo-btn{margin-top:18px}

  /* ---------- footer ---------- */
  footer{
    text-align:center;padding:30px 20px 46px;color:var(--slate-soft);
    font-size:.84rem;line-height:1.6;
  }
  footer a{color:var(--blue-deep);text-decoration:none;border-bottom:1px solid transparent;transition:border-color .15s}
  footer a:hover{border-color:var(--blue-deep)}
  footer .disclaim{margin-top:8px;font-family:var(--font-mono);font-size:.66rem;letter-spacing:.04em;opacity:.8}

  @media (max-width:520px){
    .choice{grid-template-columns:auto 1fr;padding:16px}
    .choice .arrow{display:none}
  }
  @media (prefers-reduced-motion:reduce){
    *{animation:none!important;transition:none!important;scroll-behavior:auto!important}
  }
</style>
</head>
<body>

<header class="topbar">
  <div class="brand">
    <span class="wordmark"><b>Metabase</b><span>Embedding Adventure</span></span>
  </div>
  <button class="restart" id="restartBtn" hidden onclick="restart()">
    <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/></svg>
    Start over
  </button>
</header>

<main class="stage">
  <div class="trail" id="trail" hidden></div>
  <div id="scene"></div>
</main>

<footer>
  A friendly walk-through for choosing how to embed Metabase in your product.<br>
  Dig deeper in the <a href="https://www.metabase.com/learn/metabase-basics/embedding/overview" target="_blank" rel="noopener">embedding guides</a>
  or the <a href="https://www.metabase.com/product/embedded-analytics" target="_blank" rel="noopener">embedded analytics overview</a>.
  <div class="disclaim">Unofficial interactive companion · Metabase brand colors used for illustration</div>
</footer>

<script>
/* ============================================================
   Decision tree, reconstructed from the embedding flow chart.
   Two axes drive the result:
     1) what customers can DO  (view / drill / create)
     2) how custom it must be + your frontend stack
   Data-architecture guidance splits into two models:
     - "locked"  -> Guest embedding (locked parameter)
     - "rls"     -> SSO / SDK / Full-app (user attributes, routing)
   ============================================================ */

const ICONS = {
  arrow:'<svg class="arrow" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="m13 6 6 6-6 6"/></svg>',
  back:'<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5"/><path d="m11 18-6-6 6-6"/></svg>',
  check:'<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>',
  bulb:'<svg class="ic" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#2D7CC4" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18h6"/><path d="M10 22h4"/><path d="M15.1 14a5 5 0 1 0-6.2 0c.5.4 1.1 1.2 1.1 2h4c0-.8.6-1.6 1.1-2Z"/></svg>',
  db:'<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#2D7CC4" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="12" cy="5" rx="8" ry="3"/><path d="M4 5v6c0 1.7 3.6 3 8 3s8-1.3 8-3V5"/><path d="M4 11v6c0 1.7 3.6 3 8 3s8-1.3 8-3v-6"/></svg>',
  chev:'<svg class="chev" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>'
};

/* ---- permissions journey (part 2) data, keyed by embedding model + data layout ---- */
const PERM = {
  locked:{
    blurb:"Guest embedding scopes data with signed, locked parameters.",
    commingled:{
      verdict:"Locked parameters",
      tagline:"Scope every guest embed down to a single tenant with a signed parameter.",
      how:[
        "Use a <b>Locked parameter</b> and pass a unique identifier like <code>customer_id</code>.",
        "Each customer only ever sees the rows that match their identifier."
      ],
      note:"The <b>Locked parameter is not a paid feature</b>."
    },
    isolated:{
      verdict:"Serialization",
      tagline:"Stamp out a copy of your dashboards for each tenant.",
      how:[
        "If all customers share the same table structure, programmatically duplicate dashboards using <b>Serialization</b>.",
        "If their structures differ, this approach runs out of road."
      ],
      note:"The <b>Locked parameter is not a paid feature</b> — handy if you fall back to commingled tables."
    }
  },
  rls:{
    blurb:"SSO, SDK and full-app embedding scope data with user attributes and routing.",
    commingled:{
      verdict:"Row & column level security",
      tagline:"Let per-user attributes scope the data automatically.",
      how:[
        "Apply <b>row- and column-level security using per-user attributes</b>.",
        "Every embed filters down to the signed-in customer on its own."
      ],
      note:"If customers can run their own <b>SQL</b>, add <b>Impersonation</b> so queries respect each tenant's permissions."
    },
    isolated:{
      verdict:"Database routing",
      tagline:"Send each customer to their own database or schema.",
      how:[
        "Use <b>database routing</b> when all schemas/databases share the same table structure.",
        "Using schemas? Connect each schema as its own database connection, then route."
      ],
      note:"If customers can run their own <b>SQL</b>, you'll also need <b>Impersonation</b>."
    }
  }
};

/* ---- shared result building blocks ---- */
const SSO_NOTE = "You can use Modular Embedding SSO in <b>any application that's compatible with an iframe</b>.";

/* ---- direct documentation per embedding type ---- */
const DOCS = {
  "Guest embedding":"https://www.metabase.com/docs/latest/embedding/guest-embedding",
  "Modular Embedding SSO":"https://www.metabase.com/docs/latest/embedding/modular-embedding",
  "Modular Embedding SDK":"https://www.metabase.com/docs/latest/embedding/sdk/introduction",
  "Full app embedding":"https://www.metabase.com/docs/latest/embedding/full-app-embedding"
};

/* ---- live interactive demo per embedding type ---- */
const DEMOS = {
  "Guest embedding":"https://appytown.metabase.com/",
  "Modular Embedding SSO":"https://people-analytics-embedded-demo.vercel.app/",
  "Modular Embedding SDK":"https://embedded-analytics-sdk-demo.metabase.com/admin/products",
  "Full app embedding":"https://embedding-demo.metabase.com/"
};

const NODES = {
  /* ---------------- intro ---------------- */
  intro:{type:'intro'},

  /* ---------------- chapter 1 : capabilities ---------------- */
  capabilities:{
    type:'question', chapter:"Chapter 1 · The powers",
    title:"What should your customers be able to do?",
    sub:"This is the fork in the road — it sets the whole shape of your embed.",
    choices:[
      {b:"View only, with filters", s:"They read dashboards and adjust filters. No drilling, no authoring.", to:'view_theme'},
      {b:"Drill through, no create", s:"They explore the 'why' behind a chart, but can't build new content.", to:'drill_framework'},
      {b:"Create their own reports", s:"Full self-serve — they build their own questions and dashboards, with or without AI.", to:'create_framework'}
    ]
  },

  /* ================= VIEW-ONLY branch ================= */
  view_theme:{
    type:'question', chapter:"Chapter 2 · The look",
    title:"Whitelabeling, or more control over the theme?",
    sub:"View-only embeds are the lightest-weight option. How far does the styling need to go?",
    choices:[
      {b:"Whitelabeling is enough", s:"Swap logos and colors with the appearance settings — that covers it.", to:'r_guest'},
      {b:"I need more theme control", s:"Finer styling than the appearance feature alone can give.", to:'r_sso_view'}
    ]
  },

  /* ================= DRILL-THROUGH branch ================= */
  drill_framework:{
    type:'question', chapter:"Chapter 2 · The stack",
    title:"What framework is your frontend built on?",
    sub:"Heads up: Modular Embedding SSO works in any app that can host an iframe — so this is mostly about how deep you want to integrate.",
    choices:[
      {b:"Built on React", s:"Our frontend is a React application.", to:'drill_custom'},
      {b:"Not React", s:"A different framework — but it can embed an iframe.", to:'r_sso_drill'}
    ]
  },
  drill_custom:{
    type:'question', chapter:"Chapter 3 · The integration",
    title:"How deep does the integration go?",
    sub:"You're on React, so the SDK is on the table. Do you actually need it?",
    choices:[
      {b:"An iframe is fine", s:"Whitelabeling and/or CSS theming covers us. No custom component behavior.", to:'r_sso_drill'},
      {b:"Custom functionality / workflow", s:"Build custom behavior on the embedded components, or wire the embed into my core app's workflows.", to:'r_sdk_drill'}
    ]
  },

  /* ================= CREATE branch ================= */
  create_framework:{
    type:'question', chapter:"Chapter 2 · The stack",
    title:"What framework is your frontend built on?",
    sub:"Self-serve means handing customers Metabase's query builder — and Metabot AI, if you want it. The question is how tightly it's woven in.",
    choices:[
      {b:"Built on React", s:"Our frontend is a React application.", to:'create_custom'},
      {b:"Not React", s:"A different framework, but it can host an iframe.", to:'r_fullapp'}
    ]
  },
  create_custom:{
    type:'question', chapter:"Chapter 3 · The integration",
    title:"Do you need custom components or workflow hooks?",
    choices:[
      {b:"An iframe is fine", s:"We want the full Metabase experience embedded and themed to match.", to:'r_fullapp'},
      {b:"Custom components / workflows", s:"Build bespoke UI on the embedded pieces, or connect them to my app's workflows.", to:'r_sdk_create'}
    ]
  },

  /* ================= RESULTS ================= */
  r_guest:{
    type:'result', verdict:"Guest embedding",
    tagline:"The fast lane — signed, locked-down dashboards dropped into an iframe.",
    why:[
      "Your customers only need to view and filter. No drilling, no authoring.",
      "Whitelabeling covers your styling needs.",
      "It slots into any app that can host an iframe."
    ],
    note:"Because the <b>Locked parameter isn't a paid feature</b>, this is often the most cost-effective place to start.",
    arch:'locked'
  },
  r_sso_view:{
    type:'result', verdict:"Modular Embedding SSO",
    tagline:"Single sign-on embeds, with room to style well beyond whitelabeling.",
    why:[
      "You need finer theme control than the appearance settings give you.",
      "SSO supports CSS customization/theming for fine-grained control over the look.",
      "It still drops into any iframe-compatible app."
    ],
    note:SSO_NOTE,
    arch:'rls'
  },
  r_sso_drill:{
    type:'result', verdict:"Modular Embedding SSO",
    tagline:"Drill-through analytics with SSO, living happily inside an iframe.",
    why:[
      "Customers drill into the 'why' behind a chart, but don't author new content.",
      "An iframe meets your needs — no React-specific custom components required.",
      "Reach for CSS customization/theming whenever you want finer control over the theme."
    ],
    note:SSO_NOTE,
    arch:'rls'
  },
  r_sdk_drill:{
    type:'result', verdict:"Modular Embedding SDK",
    tagline:"React-native embeds you can bend to fit your product.",
    why:[
      "Your frontend is built on React.",
      "You need custom functionality on the embedded components — or a workflow that talks to your core app from inside the embed.",
      "The SDK gives the deepest, most native integration."
    ],
    note:"Choose the SDK when an iframe simply can't reach far enough into your product.",
    arch:'rls'
  },
  r_fullapp:{
    type:'result', verdict:"Full app embedding",
    tagline:"The whole of Metabase, embedded and themed as your own.",
    why:[
      "Customers create their own questions and dashboards — true self-serve, with or without AI.",
      "An iframe works for you; you don't need React-specific custom components.",
      "Customers get the complete Metabase experience inside your product."
    ],
    note:"This hands customers the full toolkit, including the query builder, without you rebuilding it.",
    arch:'rls'
  },
  r_sdk_create:{
    type:'result', verdict:"Modular Embedding SDK",
    tagline:"Self-serve analytics, stitched natively into a React product.",
    why:[
      "Your frontend is built on React.",
      "Customers build their own reports, and you need custom components or workflows that interact with your core app.",
      "It's the most flexible path — bespoke UI plus full authoring."
    ],
    note:"The SDK is the way to go when you want self-serve power and a fully custom React surface.",
    arch:'rls'
  },

  /* ============ PERMISSIONS JOURNEY · optional part 2 ============ */
  perm_data:{
    type:'question', chapter:"Part 2 · Your data",
    title:"How is your customers' data arranged?",
    sub:"This decides how you keep each tenant's data separated.",
    choices:[
      {b:"One shared database", s:"All customers' data lives together — commingled tables, multi-tenant structure.", arr:'commingled', to:'perm_result'},
      {b:"A database or schema per customer", s:"Each customer has their own database, or their own schema.", arr:'isolated', to:'perm_result'}
    ]
  },
  perm_result:{ type:'permresult' },
  summary:{ type:'summary' }
};

/* ---------------- engine ---------------- */
let history = [];      // node ids visited (for the dot trail + back)
const state = { phase:'embedding', arch:null, arrangement:null, permStartLen:0, embedResultId:null };
const sceneEl = document.getElementById('scene');
const trailEl = document.getElementById('trail');
const restartBtn = document.getElementById('restartBtn');

const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
function go(id, pushCurrent){
  if(pushCurrent){ history.push(pushCurrent); }
  const old = sceneEl.firstElementChild;
  if(old && !reduceMotion){
    let done = false;
    const finish = ()=>{ if(done) return; done = true; render(id); };
    old.classList.add('leaving');
    old.addEventListener('animationend', finish, {once:true});
    setTimeout(finish, 260); // fallback so navigation never stalls
  }else{
    render(id);
  }
}

function render(id){
  const n = NODES[id];
  state.current = id;
  state.phase = id.indexOf('perm') === 0 ? 'permissions' : 'embedding';
  sceneEl.innerHTML = '';
  restartBtn.hidden = (id === 'intro');
  if(n.type === 'intro'){ renderIntro(); updateTrail(); return; }
  if(n.type === 'question'){ renderQuestion(id,n); }
  else if(n.type === 'permresult'){ renderPermResult(id,n); }
  else if(n.type === 'summary'){ renderSummary(); }
  else { renderResult(id,n); }
  updateTrail();
  // move focus to the heading for screen readers / keyboard users
  const h = sceneEl.querySelector('h1');
  if(h){ h.setAttribute('tabindex','-1'); h.focus({preventScroll:true}); }
  window.scrollTo({top:0, behavior:'smooth'});
}

function renderIntro(){
  const el = document.createElement('section');
  el.className = 'scene intro';
  el.innerHTML = `
    <svg class="constellation" viewBox="0 0 120 120" aria-hidden="true">
      <line x1="60" y1="22" x2="96" y2="42" stroke="#509EE3" stroke-width="1.5" opacity=".3"/>
      <line x1="96" y1="42" x2="92" y2="82" stroke="#509EE3" stroke-width="1.5" opacity=".3"/>
      <line x1="92" y1="82" x2="60" y2="100" stroke="#509EE3" stroke-width="1.5" opacity=".3"/>
      <line x1="60" y1="100" x2="24" y2="82" stroke="#509EE3" stroke-width="1.5" opacity=".3"/>
      <line x1="24" y1="82" x2="22" y2="42" stroke="#509EE3" stroke-width="1.5" opacity=".3"/>
      <line x1="22" y1="42" x2="60" y2="22" stroke="#509EE3" stroke-width="1.5" opacity=".3"/>
      <line x1="60" y1="22" x2="60" y2="60" stroke="#509EE3" stroke-width="1.5" opacity=".2"/>
      <line x1="92" y1="82" x2="60" y2="60" stroke="#509EE3" stroke-width="1.5" opacity=".2"/>
      <line x1="24" y1="82" x2="60" y2="60" stroke="#509EE3" stroke-width="1.5" opacity=".2"/>
      <circle cx="60" cy="22" r="5.5" fill="#509EE3"/>
      <circle cx="96" cy="42" r="4.5" fill="#A989C5"/>
      <circle cx="92" cy="82" r="5.5" fill="#509EE3"/>
      <circle cx="60" cy="100" r="4.5" fill="#88BF4D"/>
      <circle cx="24" cy="82" r="5.5" fill="#509EE3"/>
      <circle cx="22" cy="42" r="4.5" fill="#F2C038"/>
      <circle cx="60" cy="60" r="6.5" fill="#2D7CC4"/>
    </svg>
    <h1>Choose your <em>embedding</em> adventure</h1>
    <p>A few quick questions stand between you and the right way to put Metabase in front of your customers. Follow the trail of dots to land on an embedding strategy — then, if you like, branch into an optional second journey to work out the permissions and data-isolation strategy to pair with it.</p>
    <div class="legend">
      <span><i style="background:#509EE3"></i>Guest</span>
      <span><i style="background:#509EE3"></i>Modular SSO</span>
      <span><i style="background:#A989C5"></i>Modular SDK</span>
      <span><i style="background:#88BF4D"></i>Full app</span>
    </div>
    <button class="start" onclick="go('capabilities','intro')">
      Begin the journey
      ${ICONS.arrow}
    </button>`;
  sceneEl.appendChild(el);
}

function renderQuestion(id,n){
  const el = document.createElement('section');
  el.className = 'scene';
  const choices = n.choices.map((c,i)=>{
    const handler = c.arr
      ? `chooseArr('${id}','${c.to}','${c.arr}')`
      : `choose('${id}','${c.to}',${c.set?`'${c.set}'`:'null'})`;
    return `
    <button class="choice" onclick="${handler}">
      <span class="dot"></span>
      <span class="body"><b>${c.b}</b><span>${c.s}</span></span>
      ${ICONS.arrow}
    </button>`;
  }).join('');
  el.innerHTML = `
    <div class="eyebrow">${n.chapter}</div>
    <h1 class="q">${n.title}</h1>
    ${n.sub?`<p class="sub">${n.sub}</p>`:''}
    <div class="choices">${choices}</div>
    <div class="backrow"><button class="back" ${history.length?'':'hidden'} onclick="back()">${ICONS.back} Back a step</button></div>`;
  sceneEl.appendChild(el);
}

function renderResult(id,n){
  const el = document.createElement('section');
  el.className = 'scene';
  const why = n.why.map(w=>`<li><span class="mb-dot"></span><span>${w}</span></li>`).join('');
  const path = capabilityLabel();
  el.innerHTML = `
    <div class="verdict-tag"><span class="check">${ICONS.check}</span>Your embedding path</div>
    <h1 class="verdict">${n.verdict}</h1>
    <p class="tagline">${n.tagline}</p>

    <div class="panel">
      <div class="phead">Why this fits · ${path}</div>
      <ul class="why">${why}</ul>
      <div style="padding:0 22px 22px">
        <div class="note">${ICONS.bulb}<div><b>Worth knowing.</b> ${n.note}</div></div>
      </div>
    </div>

    <div class="next-cta">
      <div class="k">Optional · Part 2</div>
      <h3>${ICONS.db}<span>Now map out your permissions strategy</span></h3>
      <p>You've picked how to embed. The next journey works out how to keep each customer's data separate — based on how your data is arranged. ${PERM[n.arch].blurb}</p>
      <button class="btn-purple" onclick="startPermissions('${n.arch}','${id}')">
        Start the permissions journey ${ICONS.arrow}
      </button>
    </div>

    <div class="actions">
      <a class="btn-outline" href="${DOCS[n.verdict] || 'https://www.metabase.com/product/embedded-analytics'}" target="_blank" rel="noopener">
        Read the ${n.verdict} docs ${ICONS.arrow}
      </a>
      <button class="btn-ghost" onclick="back()">${ICONS.back} Back a step</button>
    </div>`;
  sceneEl.appendChild(el);
}

function renderPermResult(id,n){
  const r = PERM[state.arch] && PERM[state.arch][state.arrangement];
  const el = document.createElement('section');
  el.className = 'scene';
  if(!r){ // safety fallback if landed here without context
    el.innerHTML = `<div class="eyebrow">Part 2 · Permissions</div>
      <h1 class="q">Let's pick your data layout first.</h1>
      <div class="backrow"><button class="back" onclick="go('perm_data',null)">${ICONS.back} Choose data arrangement</button></div>`;
    sceneEl.appendChild(el); return;
  }
  const how = r.how.map(w=>`<li><span class="mb-dot purple"></span><span>${w}</span></li>`).join('');
  el.innerHTML = `
    <div class="verdict-tag part2"><span class="check">${ICONS.check}</span>Your permissions strategy</div>
    <h1 class="verdict">${r.verdict}</h1>
    <p class="tagline">${r.tagline}</p>

    <div class="panel part2">
      <div class="phead">How to set it up</div>
      <ul class="why">${how}</ul>
      <div style="padding:0 22px 22px">
        <div class="note part2">${ICONS.bulb}<div><b>Worth knowing.</b> ${r.note}</div></div>
      </div>
    </div>

    <div class="actions">
      <button class="btn-purple" onclick="go('summary','perm_result')">
        See your full plan ${ICONS.arrow}
      </button>
      <a class="btn-ghost" href="https://www.metabase.com/learn/metabase-basics/embedding/overview" target="_blank" rel="noopener">Read the docs</a>
      <button class="btn-ghost" onclick="back()">${ICONS.back} Back a step</button>
    </div>`;
  sceneEl.appendChild(el);
}

function renderSummary(){
  const emb = NODES[state.embedResultId];
  const perm = PERM[state.arch] && PERM[state.arch][state.arrangement];
  const el = document.createElement('section');
  el.className = 'scene';
  if(!emb || !perm){
    el.innerHTML = `<div class="eyebrow">Your plan</div>
      <h1 class="q">Let's finish the journey first.</h1>
      <p class="sub">Pick an embedding path, then map out permissions, and your full plan will appear here.</p>
      <div class="backrow"><button class="back" onclick="go('capabilities','intro')">${ICONS.back} Begin the journey</button></div>`;
    sceneEl.appendChild(el); return;
  }
  el.innerHTML = `
    <div class="verdict-tag plan"><span class="check">${ICONS.check}</span>Adventure complete</div>
    <h1 class="verdict">Your embedding plan</h1>
    <p class="tagline">Embed with <b>${emb.verdict}</b>, then keep each tenant's data separate using <b>${perm.verdict}</b>.</p>

    <div class="recap">
      <div class="recap-card blue">
        <div class="rc-k">How to embed</div>
        <h3>${emb.verdict}</h3>
        <p>${emb.tagline}</p>
        <div class="rc-foot">${ICONS.bulb}<span>${emb.note}</span></div>
      </div>
      <div class="recap-arrow">${ICONS.arrow}</div>
      <div class="recap-card purple">
        <div class="rc-k">How to isolate data</div>
        <h3>${perm.verdict}</h3>
        <p>${perm.tagline}</p>
        <div class="rc-foot">${ICONS.bulb}<span>${perm.note}</span></div>
      </div>
    </div>

    ${demoSection(emb.verdict)}

    <div class="actions">
      <a class="btn-outline" href="${DOCS[emb.verdict] || 'https://www.metabase.com/product/embedded-analytics'}" target="_blank" rel="noopener">
        Read the ${emb.verdict} docs ${ICONS.arrow}
      </a>
      <button class="btn-ghost" onclick="back()">${ICONS.back} Back a step</button>
    </div>`;
  sceneEl.appendChild(el);
}

function demoSection(verdict){
  const url = DEMOS[verdict];
  if(!url) return '';
  return `
    <div class="demo-cta">
      <div class="rc-k" style="color:var(--blue-deep)">See it live</div>
      <h3>Preview a ${verdict} demo</h3>
      <p>Open a real, interactive ${verdict} example in a new tab to get a feel for how it looks inside a product.</p>
      <a class="btn-primary demo-btn" href="${url}" target="_blank" rel="noopener">See a live demo&nbsp;↗</a>
    </div>`;
}

function capabilityLabel(){
  // derive a friendly label from history for the result subtitle
  if(history.includes('view_theme')) return 'View only';
  if(history.includes('drill_framework')) return 'Drill-through';
  if(history.includes('create_framework')) return 'Self-serve';
  return 'Embedding';
}

function choose(from,to,set){
  go(to, from);
}

function chooseArr(from,to,arr){
  state.arrangement = arr;
  go(to, from);
}

function startPermissions(arch, fromResultId){
  state.arch = arch;
  state.arrangement = null;
  state.embedResultId = fromResultId;
  go('perm_data', fromResultId);          // pushes the embedding result onto history
  state.permStartLen = history.length;    // permissions trail counts from here
}

function back(){
  const prev = history.pop();
  if(prev !== undefined){ go(prev, null); }
}

function restart(){
  history = [];
  state.phase = 'embedding'; state.arch = null; state.arrangement = null; state.permStartLen = 0; state.embedResultId = null;
  go('intro', null);
}

/* ---- the signature dot trail ---- */
function updateTrail(){
  if(state.current === 'intro' || state.current === 'summary'){ trailEl.hidden = true; trailEl.innerHTML=''; return; }
  trailEl.hidden = false;
  const perm = state.phase === 'permissions';
  const base = perm ? state.permStartLen : 0;          // count steps within the current part
  const steps = Math.max(0, history.length - base);
  const type = NODES[state.current].type;
  const isResult = (type === 'result' || type === 'permresult');
  const label = perm ? 'Part 2 · Permissions' : 'Part 1 · Embedding';
  let html = `<span class="trail-label ${perm?'p2':''}">${label}</span>`;
  for(let i=0;i<steps;i++){
    const link = i>0 ? `<span class="link ${perm?'p2':''}"></span>` : '';
    html += `<span class="seg">${link}<span class="node done ${perm?'p2':''}" title="step ${i+1}"></span></span>`;
  }
  const curLink = steps>0 ? `<span class="link ${perm?'p2':''}"></span>` : '';
  html += `<span class="seg">${curLink}<span class="node ${isResult?'':'current'} ${perm?'p2':''}" title="you are here"></span></span>`;
  trailEl.innerHTML = html;
}

/* boot */
render('intro');
</script>
</body>
</html>
